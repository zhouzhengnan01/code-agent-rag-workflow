<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>CLI 授权 · Codezzn</title>
  <link rel="icon" type="image/svg+xml" href="/assets/codezzn-mark.svg?v=1">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #20262c; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); background: white; border: 1px solid #e3e7eb; border-radius: 16px; padding: 36px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; font-size: 20px; font-weight: 650; text-decoration: none; }
    .brand img { width: 28px; height: 28px; }
    h1 { font-size: 25px; margin: 28px 0 16px; }
    p { font-size: 14px; line-height: 1.7; color: #596471; }
    .code { margin: 20px 0; padding: 18px; background: #f5f6f8; font-family: ui-monospace, Consolas, monospace; font-size: 24px; letter-spacing: 2px; text-align: center; border-radius: 8px; }
    label { display: block; font-size: 14px; margin-bottom: 8px; }
    input { width: 100%; border: 1px solid #c6cdd4; border-radius: 7px; padding: 12px; font: inherit; text-transform: uppercase; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    button, .button { display: inline-block; border: 1px solid #cad1d8; border-radius: 7px; padding: 11px 20px; font: inherit; font-size: 14px; cursor: pointer; background: white; color: inherit; text-decoration: none; }
    .primary { background: #263849; border-color: #263849; color: white; }
    button:disabled { opacity: .5; cursor: wait; }
    [hidden] { display: none !important; }
    #feedback { margin-top: 20px; }
    .warning { border-top: 1px solid #e8ebef; padding-top: 18px; margin-top: 24px; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #85b4da; outline-offset: 3px; }
  </style>
  <script src="/assets/cli-authorize.js?v=1" defer></script>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/assets/codezzn-mark.svg?v=1" alt="">codezzn</a>
    <h1>连接 Codezzn CLI</h1>
    <p>请核对终端中显示的授权码，再确认此设备使用你的账号。</p>
    <form id="codeForm" hidden>
      <label for="codeInput">终端授权码</label>
      <input id="codeInput" name="user_code" maxlength="11" autocomplete="off" spellcheck="false" required placeholder="ABCDE-FGHJK">
      <div class="actions"><button class="primary" type="submit">检查授权码</button></div>
    </form>
    <div id="codeDisplay" class="code" hidden></div>
    <div id="login" hidden>
      <p>先登录浏览器账号，登录后将返回这里确认授权。</p>
      <a id="loginLink" class="button primary" href="/login">登录并继续</a>
    </div>
    <section id="consent" hidden>
      <p>设备：<strong id="deviceName"></strong><br>账号：<strong id="account"></strong></p>
      <p>允许后，此 CLI 可以访问和操作你在 Codezzn 中的项目、会话与工作台资源。登录有效期为 30 天，可在终端退出登录撤销。</p>
      <p class="warning">仅确认你本人刚刚发起的登录。不要批准他人发送的授权码。</p>
      <div class="actions">
        <button id="approve" class="primary" type="button">允许此设备</button>
        <button id="deny" type="button">拒绝</button>
      </div>
    </section>
    <p id="feedback" role="status" aria-live="polite">正在检查授权请求…</p>
  </main>
</body>
</html>
