<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
  <title>登录 · Codezzn</title><link rel="icon" type="image/svg+xml" href="/assets/codezzn-mark.svg?v=1">
  <link rel="stylesheet" href="/assets/auth.css?v=0.7.0"><link rel="stylesheet" href="/assets/auth-promo.css?v=0.6.1"><link rel="stylesheet" href="/assets/auth-particle.css?v=3"><link rel="stylesheet" href="/assets/help-widget.css?v=1">
</head>
<body data-auth-mode="login">
  <main class="auth-split">
    <section class="auth-pane auth-pane--particle" aria-labelledby="authTitle">
      <canvas class="auth-particle-canvas" id="authParticleField" aria-hidden="true"></canvas>
      <a class="auth-brand" href="/" aria-label="Codezzn 首页"><span class="auth-brand-mark" aria-hidden="true"><img src="/assets/codezzn-mark.svg?v=1" alt=""></span><span class="auth-brand-word">codezzn</span></a>
      <div class="auth-workflow"><div class="auth-workflow-inner">
        <h1 id="authTitle">Sign In or Sign Up</h1><div class="current-session" id="currentSession" hidden></div>
        <section class="provider-view" id="providerView" aria-label="登录方式"><ul class="provider-list">
          <li><a class="provider-button" id="googleButton" href="/api/auth/google/start?next=/workbench.html"><img src="/assets/sites/app-roboflow-com-f07e3b30/login-7e93fba0/google.svg" alt=""><span>Continue with Google</span></a></li>
          <li class="provider-last-used"><a class="provider-button provider-github" id="githubButton" href="/api/auth/github/start?next=/workbench.html"><img src="/assets/sites/app-roboflow-com-f07e3b30/login-7e93fba0/github.svg" alt=""><span>Continue with Github</span></a><span class="last-used-badge">Last Used</span></li>
          <li><button class="provider-button" type="button" data-provider="email"><img src="/assets/sites/app-roboflow-com-f07e3b30/login-7e93fba0/mail.svg" alt=""><span>Continue with Email</span></button></li>
          <li><button class="provider-button" type="button" data-provider="sso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v2h-2V7zm0 4h2v6h-2v-6z"/></svg><span>Continue with SSO</span></button></li>
        </ul></section>
        <section class="email-step" id="emailStep" hidden aria-label="邮箱登录"><div class="floating-field"><label for="emailEntry">Email</label><input id="emailEntry" type="text" inputmode="email" autocomplete="email" required></div><div class="step-actions"><button class="action-button action-primary" id="emailNext" type="button">发送登录验证码</button><button class="email-text-action" id="emailUsePassword" type="button">使用密码登录</button><button class="action-button action-secondary" id="emailCancel" type="button">Cancel</button></div></section>
        <form class="email-code-form" id="emailCodeForm" hidden aria-label="邮箱验证码登录"><button class="selected-email" id="codeSelectedEmail" type="button" title="更换邮箱"></button><p class="email-code-help">请输入邮件中的 6 位验证码。验证码 10 分钟有效，仅可使用一次。</p><div class="floating-field"><label for="emailCode">验证码</label><input id="emailCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button class="action-button action-primary" id="codeSubmit" type="submit">验证并登录</button><button class="action-button action-secondary" id="resendCode" type="button">重新发送</button><button class="email-text-action" id="usePassword" type="button">使用密码登录</button><button class="email-text-action" id="codeCancel" type="button">返回登录方式</button></form>
        <form class="credential-form" id="authForm" hidden novalidate>
          <button class="selected-email" id="selectedEmail" type="button" title="更换邮箱"></button>
          <div class="floating-field" data-register-only hidden><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name"></div>
          <input id="email" name="email" type="hidden">
          <div class="floating-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
          <div class="floating-field" data-register-only hidden><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"></div>
          <button class="action-button action-primary submit-button" id="submitButton" type="submit"><span class="button-label">Sign In</span><span class="button-spinner" aria-hidden="true"></span></button>
          <button class="action-button action-secondary" id="formCancel" type="button">Cancel</button>
          <p class="mode-switch">New to Codezzn? <a id="switchLink" href="/register">Create an account</a></p>
        </form>
        <p class="auth-feedback" id="authFeedback" role="status" aria-live="polite"></p>
        <p class="legal-copy">By continuing, you are agreeing to our <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</p>
      </div></div>
      <footer class="auth-footer"><span>© 2026 Codezzn.</span><nav aria-label="帮助链接"><a href="/workbench.html">Workbench</a><a href="#status">Status</a></nav></footer>
    </section>
    <aside id="authPromo" class="auth-promo-mount" aria-label="Codezzn 产品展示"></aside>
  </main>
  <script src="/assets/auth-promo.js?v=0.6.1"></script><script src="/assets/auth-particle.js?v=3"></script><script src="/assets/auth.js?v=0.7.0"></script><script src="/assets/help-widget.js?v=1" defer></script>
</body>
</html>
